# Cada mes (Overture publica una versión nueva hacia la tercera semana): vuelve a importar las zonas de Explorar,
# con los sitios nuevos y ocultando los que Overture ya da por cerrados. Las zonas, en la variable ZONAS_OVERTURE
# del repositorio (Settings -> Secrets and variables -> Actions -> Variables), separadas por espacios; si no
# está, "madrid". Secretos: SUPABASE_URL y SUPABASE_CLAVE_SERVICIO.
name: Importar Overture

on:
  schedule:
    - cron: "0 4 28 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_CLAVE_SERVICIO: ${{ secrets.SUPABASE_CLAVE_SERVICIO }}
      ZONAS: ${{ vars.ZONAS_OVERTURE || 'madrid' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: obtener_datos/requirements.txt
      - run: pip install -r obtener_datos/requirements.txt
      - name: Importar
        run: |
          for zona in $ZONAS; do
            python obtener_datos/importar_overture.py --zona "$zona"
          done
