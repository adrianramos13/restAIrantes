# Los lunes de madrugada comprueba en Google Maps si los sitios de Explorar siguen abiertos (no necesita sesión de
# Google). El análisis de lo pedido NO va aquí: Google anula la sesión si se usa desde un servidor; lo hace el
# procesador en tu ordenador (tarea de Windows, ver el README). Secretos: SUPABASE_URL y SUPABASE_CLAVE_SERVICIO.
# Los registros son públicos: el script no imprime correos ni claves.
name: Comprobar sitios abiertos

on:
  schedule:
    - cron: "0 3 * * 1"        # lunes 3:00 UTC (4:00 en Madrid en invierno, 5:00 en verano)
  workflow_dispatch:           # a mano, desde la pestaña Actions

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 340       # la comprobación de los lunes dura 5 h (GitHub permite hasta 6)
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_CLAVE_SERVICIO: ${{ secrets.SUPABASE_CLAVE_SERVICIO }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: obtener_datos/requirements.txt
      - name: Instalar
        run: |
          pip install -r obtener_datos/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Comprobar si los sitios siguen abiertos
        run: python obtener_datos/verificar_lugares.py --minutos 300
